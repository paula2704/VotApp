services:
  postgres:
    image: postgres:16
    container_name: votapp-db
    environment:
      POSTGRES_DB: votapp
      POSTGRES_USER: votapp_user
      POSTGRES_PASSWORD: votapp_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: