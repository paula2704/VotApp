spring.application.name=votapp

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/votapp
spring.datasource.username=votapp_user
spring.datasource.password=votapp_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Puerto
server.port=8080