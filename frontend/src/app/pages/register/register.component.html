<div class="min-h-screen flex items-center justify-center relative overflow-hidden"
     style="background: radial-gradient(ellipse at top right, #B51A2B 0%, #1B1E2F 40%, #242F49 100%);">

  <!-- círculos decorativos -->
  <div style="
    position: absolute; width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(255,165,134,0.2) 0%, transparent 70%);
    top: -100px; right: -100px; border-radius: 50%;
  "></div>
  <div style="
    position: absolute; width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(181,26,43,0.3) 0%, transparent 70%);
    bottom: -50px; left: -50px; border-radius: 50%;
  "></div>

  <!-- card glassmorphism -->
  <div style="
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 48px 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    position: relative;
    z-index: 10;
    margin: 20px;
  ">

    <!-- header -->
    <div class="flex flex-col items-center mb-8">
      <div style="
        width: 80px; height: 80px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin-bottom: 16px;
      ">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"
                stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="9" cy="7" r="4"
                  stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          <path d="M19 8v6M22 11h-6"
                stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h2 style="color: #F5F5F5; font-size: 26px; font-weight: 600; margin-bottom: 4px;">
        Crear cuenta
      </h2>
      <p style="color: rgba(255,255,255,0.5); font-size: 13px;">
        Regístrate para empezar a votar
      </p>
    </div>

    <!-- error -->
    <div *ngIf="error" style="
      background: rgba(181,26,43,0.3);
      border: 1px solid rgba(181,26,43,0.5);
      border-radius: 10px;
      padding: 10px 16px;
      color: #FFA586;
      font-size: 13px;
      margin-bottom: 16px;
    ">⚠️ {{ error }}</div>

    <div style="display: flex; flex-direction: column; gap: 14px;">

      <!-- usuario -->
      <div style="
        display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 12px 16px;
      ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
                stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="7" r="4"
                  stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
        </svg>
        <input
          type="text"
          [(ngModel)]="username"
          placeholder="Usuario"
          style="background: transparent; border: none; outline: none; color: #F5F5F5; font-size: 14px; width: 100%;"
        />
      </div>

      <!-- contraseña -->
      <div style="
        display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 12px 16px;
      ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2"
                stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"
                stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          type="password"
          [(ngModel)]="password"
          placeholder="Contraseña (mínimo 6 caracteres)"
          style="background: transparent; border: none; outline: none; color: #F5F5F5; font-size: 14px; width: 100%;"
        />
      </div>

      <!-- confirmar contraseña -->
      <div style="
        display: flex; align-items: center; gap: 12px;
        background: rgba(255,255,255,0.07);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 12px;
        padding: 12px 16px;
      ">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9 12l2 2 4-4"
                stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
          <rect x="3" y="11" width="18" height="11" rx="2"
                stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"
                stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          type="password"
          [(ngModel)]="confirmPassword"
          placeholder="Confirmar contraseña"
          style="background: transparent; border: none; outline: none; color: #F5F5F5; font-size: 14px; width: 100%;"
        />
      </div>

      <!-- selector de rol estilo radio tabs -->
      <div>
        <p style="color: rgba(255,255,255,0.5); font-size: 12px; margin-bottom: 8px;">
          Tipo de cuenta
        </p>
        <div style="
          display: flex;
          background: rgba(255,255,255,0.07);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 12px;
          padding: 4px;
          gap: 4px;
        ">
          <button
            (click)="role = 'USER'"
            style="
              flex: 1; padding: 8px;
              border-radius: 9px; border: none;
              font-size: 13px; font-weight: 600;
              cursor: pointer; transition: all 0.2s;
            "
            [style.background]="role === 'USER' ? 'linear-gradient(135deg, #B51A2B, #541A2E)' : 'transparent'"
            [style.color]="role === 'USER' ? '#fff' : 'rgba(255,255,255,0.4)'">
            👤 Usuario
          </button>
          <button
            (click)="role = 'ADMIN'"
            style="
              flex: 1; padding: 8px;
              border-radius: 9px; border: none;
              font-size: 13px; font-weight: 600;
              cursor: pointer; transition: all 0.2s;
            "
            [style.background]="role === 'ADMIN' ? 'linear-gradient(135deg, #B51A2B, #541A2E)' : 'transparent'"
            [style.color]="role === 'ADMIN' ? '#fff' : 'rgba(255,255,255,0.4)'">
            ⚙️ Admin
          </button>
        </div>
      </div>

      <!-- botón registro -->
      <button
        (click)="onSubmit()"
        [disabled]="loading"
        class="glass-btn"
        style="
          width: 100%;
          padding: 14px;
          border-radius: 12px;
          border: none;
          background: linear-gradient(135deg, #B51A2B, #541A2E);
          color: white;
          font-weight: 600;
          font-size: 15px;
          letter-spacing: 1px;
          cursor: pointer;
          margin-top: 4px;
          transition: all 0.3s;
          text-transform: uppercase;
        ">
        {{ loading ? 'Creando cuenta...' : 'REGISTRARSE' }}
      </button>

      <!-- divisor -->
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.15);"></div>
        <span style="color: rgba(255,255,255,0.4); font-size: 12px;">o</span>
        <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.15);"></div>
      </div>

      <!-- link login -->
      <button
        routerLink="/login"
        style="
          width: 100%;
          padding: 12px;
          border-radius: 12px;
          border: 1px solid rgba(255,255,255,0.15);
          background: rgba(255,255,255,0.05);
          color: rgba(255,255,255,0.7);
          font-weight: 500;
          font-size: 14px;
          cursor: pointer;
        ">
        Ya tengo cuenta
      </button>

    </div>
  </div>
</div>

<style>
.glass-btn:hover {
  box-shadow: 0 8px 25px rgba(181, 26, 43, 0.5);
  transform: translateY(-1px);
}
.glass-btn:active {
  transform: translateY(1px);
}
.glass-btn:disabled {
  background: rgba(255,255,255,0.1) !important;
  color: rgba(255,255,255,0.3);
  cursor: not-allowed;
}
</style>
